<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Dissect Together: Student</title>
<style>
  :root { --bg:#0f1419; --card:#18202a; --line:#2a3440; --text:#e8eef5; --muted:#8ea0b3; --accent:#35e0c0; --blue:#4aa3ff; --orange:#ffa24a; --bad:#ff6b6b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text);
    font:15px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; overscroll-behavior:none; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }

  #top { position:fixed; top:0; left:0; right:0; padding: calc(env(safe-area-inset-top) + 10px) 16px 8px;
    display:flex; align-items:center; gap:10px; pointer-events:none; }
  .chip { pointer-events:auto; background:rgba(24,32,42,.85); border:1px solid var(--line); border-radius:999px; padding:6px 12px; font-weight:600; backdrop-filter: blur(8px); }
  #dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--bad); margin-right:6px; }
  #dot.on { background: var(--accent); }

  #modes { position:fixed; top: calc(env(safe-area-inset-top) + 54px); left:16px; right:16px; display:flex; gap:8px; }
  #modes button { flex:1; appearance:none; border:1px solid var(--line); background:rgba(24,32,42,.85); color:var(--text);
    border-radius:10px; padding:10px 6px; font:inherit; font-weight:600; backdrop-filter: blur(8px); }
  #modes button[aria-pressed="true"] { background: var(--accent); color:#04201a; border-color: var(--accent); }
  #modes button:disabled { opacity:.35; }

  .marker { position:fixed; transform: translate(-50%, -50%); padding:6px 10px; border-radius:10px; font-weight:700; font-size:13px;
    pointer-events:none; white-space:nowrap; display:none; border:2px solid; background:rgba(15,20,25,.88); }
  #markerTeacher { border-color: var(--blue); color: var(--blue); }
  #markerLearner { border-color: var(--orange); color: var(--orange); }

  #sheet { position:fixed; left:12px; right:12px; bottom: calc(env(safe-area-inset-bottom) + 12px);
    background:rgba(24,32,42,.95); border:1px solid var(--line); border-radius:16px; padding:14px; backdrop-filter: blur(10px);
    max-width: 560px; margin: 0 auto; }
  #sheet h2 { margin:0 0 4px; font-size:16px; }
  #sheet p { margin:0 0 8px; color:var(--muted); font-size:13px; }
  #sheet textarea { width:100%; background:#0f1419; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:10px; font:inherit; resize:none; height:56px; }
  #sheet .row { display:flex; gap:8px; margin-top:8px; }
  #sheet button { appearance:none; border:0; border-radius:10px; padding:12px 14px; font:inherit; font-weight:700; }
  #ask { flex:1; background:var(--accent); color:#04201a; }
  #clear { background:transparent; color:var(--muted); border:1px solid var(--line) !important; }
  #mine { margin-top:8px; font-size:13px; color:var(--muted); }
  #mine b { color: var(--text); }

  #toast { position:fixed; left:50%; top: calc(env(safe-area-inset-top) + 100px); transform:translateX(-50%); background:var(--card);
    border:1px solid var(--line); padding:8px 14px; border-radius:10px; font-weight:600; opacity:0; transition:opacity .2s; pointer-events:none; max-width: 90vw; text-align:center; }
  #toast.show { opacity:1; }

  #joinForm { position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:24px; text-align:center; }
  #joinForm input { background:#0f1419; color:var(--text); border:1px solid var(--line); border-radius:12px; padding:14px; font:inherit; font-size:28px; width:6ch; text-align:center; text-transform:uppercase; letter-spacing:.2em; }
  #joinForm button { appearance:none; border:0; border-radius:12px; padding:14px 24px; background:var(--accent); color:#04201a; font:inherit; font-weight:700; }
  [hidden] { display:none !important; }
</style>
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="c"></canvas>

<div id="top">
  <span class="chip"><span id="dot"></span><span id="roomLabel">Room</span></span>
  <span class="chip" id="presence"></span>
</div>

<div id="modes" role="group" aria-label="View mode">
  <button data-mode="free" aria-pressed="true">My view</button>
  <button data-mode="teacher" aria-pressed="false" disabled>Teacher's view</button>
  <button data-mode="learner" aria-pressed="false" disabled>Learner's view</button>
</div>

<div class="marker" id="markerTeacher"></div>
<div class="marker" id="markerLearner"></div>
<div id="toast"></div>

<div id="sheet">
  <h2 id="sheetTitle">Touch any part of the frog</h2>
  <p id="sheetHint">Then ask your teacher a question about it.</p>
  <div id="askBox" hidden>
    <textarea id="text" maxlength="280" placeholder="Your question (optional)"></textarea>
    <div class="row">
      <button id="ask">Raise hand</button>
      <button id="clear">Clear</button>
    </div>
  </div>
  <div id="mine"></div>
</div>

<form id="joinForm" hidden>
  <h2>Join the class</h2>
  <p>Enter the 4-letter room code your teacher is showing.</p>
  <input id="roomInput" maxlength="4" autocomplete="off" autocapitalize="characters" aria-label="Room code">
  <button type="submit">Join</button>
</form>

<script type="module" src="./main.js"></script>
</body>
</html>
