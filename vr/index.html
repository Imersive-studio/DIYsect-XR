<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dissect Together: Headset</title>
<style>
  :root { --bg:#0f1419; --card:#18202a; --line:#2a3440; --text:#e8eef5; --muted:#8ea0b3; --accent:#35e0c0; --bad:#ff6b6b; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #hud { position:fixed; top:12px; left:12px; max-width: 360px; background:rgba(24,32,42,.9); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  #hud h1 { margin:0 0 6px; font-size:15px; }
  #hud .row { color:var(--muted); font-size:13px; }
  #hud kbd { background:#0f1419; border:1px solid var(--line); border-radius:5px; padding:0 5px; }
  #dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--bad); margin-right:6px; }
  #dot.on { background: var(--accent); }
  #msg { margin-top:8px; min-height:20px; font-weight:600; }
  #qs { margin-top:8px; font-size:13px; }
  #qs div { padding:4px 0; border-top:1px solid var(--line); }
  #qs b { color: var(--accent); }
</style>
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <h1><span id="dot"></span><span id="title">Headset</span></h1>
  <div class="row" id="who"></div>
  <div class="row" id="help"></div>
  <div id="msg"></div>
  <div id="qs"></div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
